; Клавиатура 4x4 на ATmega328P, по I2C (ведущий) передаёт пакеты в STM32F407
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ATmega328P

[common]
platform = atmelavr
board = ATmega328P
framework = arduino
; Кварц 16 МГц подтверждён окружением clocktest (2026-10-04).
; От F_CPU зависят тайминги (антидребезг, пауза) и скорости UART и I2C.
board_build.f_cpu = 16000000L
board_hardware.oscillator = external
board_hardware.bod = 2.7v

; Программатор USBasp (тот же, что работает в PROGISP). Для avrdude под Windows
; нужен драйвер libusb-win32/libusbK (Zadig). Можно и без этого: зашить
; .pio/build/<env>/firmware.hex через PROGISP.
; -B 32: медленный SCK ISP, чтобы шилось и при тактовой 1 МГц.
; НЕ запускать "Set Fuses" / "Burn Bootloader", пока фьюзы не выяснены.
upload_protocol = usbasp
upload_flags = -B 32

; Рабочая прошивка клавиатуры
[env:ATmega328P]
extends = common
build_src_filter = +<*> -<clocktest.cpp>
monitor_speed = 1000000
build_flags =
    -Wall
    -D WIRE_TIMEOUT     ; Wire.setWireTimeout: не виснуть на занятой/замкнутой шине
;   -D KBD_DEBUG        ; вывод нажатий и результатов передачи в UART 1 000 000 (I2C работает)

; Тест модуля без STM32: UART 1 000 000 (TX = PD1), печать нажатий и пакетов с CRC
; и хвостом; пакеты считаются доставленными, I2C не используется.
[env:i2cdebug]
; как ATmega328P, плюс лог в UART (1 000 000): "TX seq N res R" на каждую передачу.
; R: 0 принят, 2 STM32 не ответил на адрес, 3 NACK хвоста (CRC), 5 таймаут шины
extends = env:ATmega328P
build_flags =
    -Wall
    -D WIRE_TIMEOUT
    -D KBD_DEBUG

[env:uarttest]
extends = env:ATmega328P
build_flags =
    -Wall
    -D KBD_UART_TEST

; Тест платы: частота кварца и напряжение питания (src/clocktest.cpp)
; pio run -e clocktest -t upload ; pio device monitor -e clocktest
[env:clocktest]
extends = common
build_src_filter = +<clocktest.cpp>
monitor_speed = 9600
