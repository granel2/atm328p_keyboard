; Клавиатура 4x4 на ATmega328P, I2C-ведомый для STM32F407
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ATmega328P

[common]
platform = atmelavr
board = ATmega328P
framework = arduino
; Частота кварца пока не определена - см. окружение clocktest.
; От неё зависят только тайминги (антидребезг, пауза) и скорость UART:
; I2C-ведомый тактируется от STM32 и работает при любой частоте >= 16 x SCL.
board_build.f_cpu = 16000000L
board_hardware.oscillator = external
board_hardware.bod = 2.7v

; Программатор USBasp (тот же, что работает в PROGISP). Для avrdude под Windows
; нужен драйвер libusb-win32/libusbK (Zadig). Можно и без этого: зашить
; .pio/build/<env>/firmware.hex через PROGISP.
; -B 32: медленный SCK ISP, чтобы шилось и при тактовой 1 МГц.
; НЕ запускать "Set Fuses" / "Burn Bootloader", пока фьюзы не выяснены.
upload_protocol = usbasp
upload_flags = -B 32

; Рабочая прошивка клавиатуры
[env:ATmega328P]
extends = common
build_src_filter = +<*> -<clocktest.cpp>
monitor_speed = 38400
build_flags =
    -Wall
;   -D KBD_DEBUG        ; вывод нажатий в UART 38400 (I2C работает как обычно)

; Тест модуля без STM32: UART 38400 (TX = PD1), печать нажатий и пакетов с CRC,
; пакеты подтверждаются автоматически. С подключённым STM32 не использовать.
[env:uarttest]
extends = env:ATmega328P
build_flags =
    -Wall
    -D KBD_UART_TEST

; Тест платы: частота кварца и напряжение питания (src/clocktest.cpp)
; pio run -e clocktest -t upload ; pio device monitor -e clocktest
[env:clocktest]
extends = common
build_src_filter = +<clocktest.cpp>
monitor_speed = 9600
